# nw-builder@3.7.4 (the old, pinned version used for NW.js desktop packaging) has a
# transitive dependency resolved via a git URL rather than the registry. pnpm's default
# supply-chain protection refuses to install any subdependency it can't trace to a trusted
# source; this is a legitimate pre-existing part of nw-builder's own dependency tree, not a
# compromised package, so it's safe to allow rather than work around by vendoring/overriding.
blockExoticSubdeps: false

# Packages with install/build scripts pnpm otherwise refuses to run unattended. yarn is a
# direct devDependency (gulp-yarn's nested `yarn install` inside dist/ uses it when packaging
# the desktop app), es5-ext is a common transitive utility library, esbuild is Vite's
# bundler, and macos-alias/fs-xattr are appdmg's native modules for the macOS DMG build.
allowBuilds:
  es5-ext: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  yarn: true
