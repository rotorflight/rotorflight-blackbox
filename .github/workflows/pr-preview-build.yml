name: PR Preview Build

# Builds a web app preview of a pull request, which PR Preview Publish then
# deploys to /pr/<number>/ on the Pages site.
#
# Only PRs a maintainer has labelled "preview" are built: a preview runs the
# PR's code on the same origin as the real builds. This workflow runs that
# code (fork PRs included), so it gets a read-only token and publishes
# nothing itself -- the bundle leaves only as an artifact. A PR can edit this
# file, so PR Preview Publish checks the label again before deploying.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PR Preview
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest

    # Job-level, so a skipped run (another label added) doesn't cancel a
    # build that is already going.
    concurrency:
      group: pr-preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Same CI version stamp as deploy-web.yml, naming the PR.
      - name: Update version number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make version SEMVER="0.0.0-PR$PR_NUMBER-${HEAD_SHA:0:7}"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # web-dist uses relative paths, so the build serves from /pr/<n>/
      # without a base path.
      - name: Build web app
        run: pnpm gulp web-dist

      - name: Package preview
        shell: bash
        run: |
          mkdir preview
          mv web-dist preview/site
          echo "${{ github.event.pull_request.number }}" > preview/pr-number

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview
          path: preview
          retention-days: 7
