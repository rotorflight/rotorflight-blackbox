name: Deploy Web App

on:
  push:
    branches:
      - master
      - 'RF-*'
      - feature/**
      - bugfix/**
      - experiment/**
      - release/**
    tags:
      - "release/**"
      - "snapshot/**"
  delete:
  workflow_dispatch:
    inputs:
      deployment_path:
        description: "Optional deployment path override"
        required: false
        type: string

permissions:
  contents: write

env:
  SITE_URL: https://blackbox.rotorflight.org

# One group per deployed ref. A single shared group let an unrelated run evict
# a pending one: GitHub keeps only one pending run per group, so deleting a
# branch right after merging it cancelled the queued master deploy. Within a
# group a newer run still replaces an older pending one, which is what we want
# for repeat pushes. A delete event's github.ref is the default branch, so key
# it on the deleted branch's full ref instead -- the same group as that
# branch's push deploys, so the cleanup waits for an in-flight deploy (or
# replaces a pending one) rather than racing it and being undone by it.
# Runs in different groups can publish concurrently, so the gh-pages push
# steps below retry on top of whatever landed first.
concurrency:
  group: pages-${{ github.event_name == 'delete' && format('refs/heads/{0}', github.event.ref) || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Web App
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine deployment path
        id: path
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.deployment_path }}" ]; then
            DEPLOY_PATH="${{ github.event.inputs.deployment_path }}"
            UPDATE_LATEST="false"
            SEMVER="0.0.0-CI-${GITHUB_SHA:0:7}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#*/}"
            if [[ "$TAG" == release/* ]]; then
              DEPLOY_PATH="release/$VERSION"
            else
              DEPLOY_PATH="snapshot/$VERSION"
            fi
            # Only a plain X.Y.Z release (not an RC) becomes the "latest" stable build.
            if [[ "$TAG" == release/* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              UPDATE_LATEST="true"
            else
              UPDATE_LATEST="false"
            fi
            SEMVER="$VERSION"
          else
            DEPLOY_PATH="${{ github.ref_name }}"
            if [ "$DEPLOY_PATH" != "master" ]; then
              DEPLOY_PATH="$(echo "$DEPLOY_PATH" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
            fi
            UPDATE_LATEST="false"
            SEMVER="0.0.0-CI-${GITHUB_SHA:0:7}"
          fi

          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "update_latest=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $DEPLOY_PATH"
          echo "Update latest: $UPDATE_LATEST"
          echo "Version: $SEMVER"

      - name: Update version number
        run: make version SEMVER="${{ steps.path.outputs.semver }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm gulp web-dist

      - name: Create GitHub Pages branch if missing
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            exit 0
          fi
          # First deploy: publish an empty orphan branch for the steps below to build on.
          # Another run may win the race to create it, which is fine.
          EMPTY_TREE=$(git hash-object -t tree /dev/null)
          COMMIT=$(git -c user.name="github-actions[bot]" \
                       -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                       commit-tree "$EMPTY_TREE" -m "Initialise GitHub Pages branch")
          git push origin "$COMMIT:refs/heads/gh-pages" || git ls-remote --exit-code --heads origin gh-pages

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Publish to GitHub Pages branch
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"
          UPDATE_LATEST="${{ steps.path.outputs.update_latest }}"

          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another ref's run may push gh-pages first; each attempt rebuilds
          # this run's changes on top of the latest gh-pages and tries again.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            rm -rf "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH"
            cp -R ../web-dist/. "$DEPLOY_PATH/"

            if [ "$UPDATE_LATEST" = "true" ]; then
              rm -rf latest
              mkdir -p latest
              cp -R ../web-dist/. latest/
            fi

            cp -R ../.github/pages/. .
            python3 ../.github/scripts/generate_versions.py

            git add .
            if git diff --cached --quiet; then
              echo "No GitHub Pages changes to publish"
              exit 0
            fi
            git commit -m "deploy: $DEPLOY_PATH from ${{ github.sha }}"

            if git push origin gh-pages; then
              exit 0
            fi
            echo "gh-pages push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

          echo "Failed to publish to gh-pages after 5 attempts"
          exit 1

      - name: Print deployment URLs
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          echo "Deployment index: $SITE_URL/"
          echo "Deployment: $SITE_URL/$DEPLOY_PATH/"
          if [ "${{ steps.path.outputs.update_latest }}" = "true" ]; then
            echo "Latest stable: $SITE_URL/latest/"
          fi

  cleanup-deleted-branch:
    name: Cleanup Deleted Branch Deployment
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Determine deployment path
        id: path
        shell: bash
        run: |
          DEPLOY_PATH="${{ github.event.ref }}"
          DEPLOY_PATH="$(echo "$DEPLOY_PATH" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"

          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "Deleting deployment path: $DEPLOY_PATH"

      - name: Remove deployment from GitHub Pages branch
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same retry-on-rejected-push loop as the deploy job's publish step.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            if [ -d "$DEPLOY_PATH" ]; then
              rm -rf "$DEPLOY_PATH"
              echo "Deleted pages/$DEPLOY_PATH"
            else
              echo "No deployment found for pages/$DEPLOY_PATH"
            fi

            cp -R ../.github/pages/. .
            python3 ../.github/scripts/generate_versions.py

            git add .
            if git diff --cached --quiet; then
              echo "No GitHub Pages changes to publish"
              exit 0
            fi
            git commit -m "cleanup: remove deployment for deleted branch ${{ github.event.ref }}"

            if git push origin gh-pages; then
              exit 0
            fi
            echo "gh-pages push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

          echo "Failed to publish to gh-pages after 5 attempts"
          exit 1
